- defaults:
    link:
      create: true
      relink: true
      force: true
- clean: ['~','~/.config']
- link: 
    ~/.zshrc: zshrc
    ~/.p10k.zsh: p10k.zsh
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.antidote: antidote
    ~/.gitconfig: gitconfig
    ~/.tmux.conf: tmux.conf
    ~/.local/scripts: scripts
    ~/.config/:
      glob: true
      path: config/*
      relink: true
      exclude: [ config/Code, config/systemd ]
    ~/.config/systemd/user/:
      create: true
      glob: true
      path: config/systemd/user/*
      relink: true
    ~/.config/Code/User/:
      create: true
      glob: true
      path: vscode/*
      relink: true
- shell: []
